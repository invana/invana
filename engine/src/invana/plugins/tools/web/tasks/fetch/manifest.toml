key = "web.fetch"
version = "0.1.0"
summary = "Read one web page, if robots.txt allows it, as its title, text and links."
bound = "network"
side_effect = "read"
requires = []
resources = ["cpu"]
timeout_s = 30
retries = 2

[args]
url = { type = "str", required = true }

[outputs]
url = "str"
title = "str"
text = "str"
links = "list"
fetched_at = "str"
