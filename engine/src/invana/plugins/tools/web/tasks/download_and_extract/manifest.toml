key = "web.download_and_extract"
version = "0.1.0"
summary = "Download a file, unzip it if it is an archive, and parse its CSV, JSON or text into cited rows."
bound = "network"
side_effect = "read"
requires = []
resources = ["cpu"]
timeout_s = 120
retries = 2

[args]
url = { type = "str", required = true }
max_mb = { type = "int", default = 50 }

[outputs]
url = "str"
files = "list"
rows = "list"
fetched_at = "str"
