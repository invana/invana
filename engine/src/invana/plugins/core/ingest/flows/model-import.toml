# One of the plans ingestion is assembled from. Its steps are task type
# primitives — `data.records.validate`, `graph.write.records`, `stitch`, `data.snapshot` — and
# the plan is what orders them. `model-import`, not `dataset-import`: records are
# imported **into a model**, and the model is what holds them.

key = "model-import"
version = 1
kind = "import"
description = "Load records into a model: check them, write them, resolve their edges, record what landed."
intents = []

[[steps]]
id = "data_records_validate"
task = "data.records.validate"
label = "Validate"

[[steps]]
id = "graph_write_records"
task = "graph.write.records"
label = "Write"

[[steps]]
id = "graph_stitch_run"
task = "graph.stitch.run"
label = "Stitch"

[[steps]]
id = "data_snapshot"
task = "data.snapshot"
label = "Snapshot"
