key = "execute_graph_query"
version = "1.0.0"
summary = "Run a validated query against the graph, under the run's lens."
bound = "graph_read"
side_effect = "read"
requires = ["validate_query"]
resources = ["cpu"]

[args]
query = { type = "str" }
read_only = { type = "bool", default = true }

[outputs]
rows = "int"
execution_time_ms = "int"
result_type = "str"
