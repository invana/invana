key = "graph.read.query"
version = "1.0.0"
summary = "Run a validated query against the graph, under the run's lens."
bound = "graph_read"
side_effect = "read"
requires = ["graph.read.validate"]
resources = ["cpu"]

[args]
query = { type = "str", required = true }
read_only = { type = "bool", default = true }

[outputs]
rows = "int"
execution_time_ms = "int"
result_type = "str"
