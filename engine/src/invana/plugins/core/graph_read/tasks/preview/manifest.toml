key = "graph.stitch.preview"
version = "1.0.0"
summary = "Count what stitch rules resolve — one draft, or every declared stitch — under the run's lens."
bound = "graph_read"
side_effect = "read"
requires = []
resources = ["cpu"]

[args]
rules = { type = "list" }
all_links = { type = "bool", default = false }

[outputs]
previews = "list"
