key = "nl-compare"
version = 1
kind = "ask"
description = "Two readings of the graph, compared, with the difference charted."
intents = ["compound", "aggregate_and_chart"]

[[steps]]
id = "translate_a"
task = "translate_thought"
label = "Translate A"

[[steps]]
id = "validate_a"
task = "validate_query"
label = "Validate A"
args = { query = "${steps.translate_a.query}" }

[[steps]]
id = "execute_a"
task = "execute_graph_query"
label = "Execute A"
args = { query = "${steps.translate_a.query}", read_only = true }

[[steps]]
id = "translate_b"
task = "translate_thought"
label = "Translate B"

[[steps]]
id = "validate_b"
task = "validate_query"
label = "Validate B"
args = { query = "${steps.translate_b.query}" }

[[steps]]
id = "execute_b"
task = "execute_graph_query"
label = "Execute B"
args = { query = "${steps.translate_b.query}", read_only = true }

[[steps]]
id = "shape_for_canvas"
task = "shape_for_canvas"
label = "Project"

[[steps]]
id = "verify_result"
task = "verify_result"
label = "Verify"
