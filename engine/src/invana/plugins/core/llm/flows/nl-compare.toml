key = "nl-compare"
version = 1
kind = "ask"
description = "Two readings of the graph, compared, with the difference charted."
intents = ["compound", "aggregate_and_chart"]

[[steps]]
id = "translate_a"
task = "nl.translate"
label = "Translate A"

[[steps]]
id = "validate_a"
task = "graph.read.validate"
label = "Validate A"
args = { query = "${steps.translate_a.query}" }

[[steps]]
id = "execute_a"
task = "graph.read.query"
label = "Execute A"
args = { query = "${steps.translate_a.query}", read_only = true }

[[steps]]
id = "translate_b"
task = "nl.translate"
label = "Translate B"

[[steps]]
id = "validate_b"
task = "graph.read.validate"
label = "Validate B"
args = { query = "${steps.translate_b.query}" }

[[steps]]
id = "execute_b"
task = "graph.read.query"
label = "Execute B"
args = { query = "${steps.translate_b.query}", read_only = true }

[[steps]]
id = "answer_shape"
task = "answer.shape"
label = "Project"

[[steps]]
id = "plan_verify"
task = "plan.verify"
label = "Verify"
