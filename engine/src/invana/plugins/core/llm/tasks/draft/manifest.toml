key = "plan.draft"
version = "1.0.0"
summary = "Draw a skill's playbook as its plan, one sentence at a time."
bound = "llm"
side_effect = "read"
requires = []
resources = ["llm"]

[args]
skill_version_id = { type = "str", required = true }

[outputs]
plan_id = "str"
steps = "int"
unmapped = "list"
question = "str"
span = "str"
clarification_id = "str"
options = "list"
