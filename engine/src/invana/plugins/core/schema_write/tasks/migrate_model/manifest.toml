key = "migrate_model"
version = "1.0.0"
summary = "Scan what a breaking model change touches; applying an approved review, publish it."
bound = "schema_write"
side_effect = "write"
requires = []
resources = ["cpu"]

[args]
model_id = { type = "str", required = true }
version_id = { type = "str", required = true }
base_version_id = { type = "str" }
review_id = { type = "str" }
apply = { type = "bool", default = false }

[outputs]
classification = "str"
preview = "obj"
published_version = "str"
failed = "int"
