[project]
name = "invana-engine"
version = "0.0.0"
description = "Invana — Graph Intelligence Platform"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.13.1",
    "click>=8.0",
    "gremlinpython>=3.8.1",
    "neo4j>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.15",
    "cryptography>=42",
    "passlib[bcrypt]>=1.7.4",
    # Pin bcrypt < 5: passlib 1.7.4 trips its internal "wrap bug" check on
    # bcrypt 5.x, which now raises ValueError for >72-byte passwords during
    # passlib's library init. Upstream fix is awaited in passlib 1.8.
    "bcrypt<5",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "starlette-admin>=0.16",
    "psycopg2-binary>=2.9",
    "itsdangerous>=2.2",
]
telemetry = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-logging>=0.46b0",
]
all = [
    "invana-engine[server]",
    "invana-engine[telemetry]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    # Local connector integrations — installed editable so the engine dev env
    # can resolve any connector_class the studio offers (Connection settings).
    # In production, deployers install only the integrations they need.
    "invana-neo4j",
    "invana-memgraph",
    "invana-arcadedb",
    "invana-janusgraph",
    "invana-tinkergraph",
]

[tool.uv.sources]
invana-neo4j = { path = "../integrations/invana-neo4j", editable = true }
invana-memgraph = { path = "../integrations/invana-memgraph", editable = true }
invana-arcadedb = { path = "../integrations/invana-arcadedb", editable = true }
invana-janusgraph = { path = "../integrations/invana-janusgraph", editable = true }
invana-tinkergraph = { path = "../integrations/invana-tinkergraph", editable = true }

[project.scripts]
invana = "invana.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invana"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI requires Depends() in function argument defaults
]
