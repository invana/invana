[project]
name = "invana-engine"
version = "0.0.0"
description = "Invana — Graph Intelligence Platform"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "click>=8.5.0",
    "gremlinpython>=3.8.1",
    "neo4j>=6.3.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "cryptography>=50.0.1",
    "passlib[bcrypt]>=1.7.4",
    # Pin bcrypt < 6: passlib 1.7.4 trips its internal "wrap bug" check on
    # bcrypt 5.x, which now raises ValueError for >72-byte passwords during
    # passlib's library init. Upstream fix is awaited in passlib 1.8.
    "bcrypt<5",
    "PyJWT>=2.13.0",
    # The LLM runtime (RFC-032) calls Ollama + OpenAI-compatible servers over
    # plain HTTP — the providers import httpx at module load, and the LLM client
    # (and the sessions router) import them eagerly, so httpx is required for the
    # engine to import at all. The optional `anthropic`/`openai` SDKs are NOT
    # required: the keyless local/ollama paths use httpx only.
    "httpx>=0.28.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "starlette-admin>=1.0.1",
    "psycopg2-binary>=2.9.12",
    "itsdangerous>=2.2",
]
telemetry = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    # Note: the browser-span proxy route (RFC-025) forwards OTLP/HTTP via httpx,
    # which is a core dependency (see [project].dependencies) — not repeated here.
]
all = [
    "invana-engine[server]",
    "invana-engine[telemetry]",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    # ASGI test client — FastAPI/Starlette's TestClient is built on httpx, so
    # any HTTP-level route test needs it. Used by tests/**/test_*routes/api*.
    "httpx>=0.28.1",
    # Local connector integrations — installed editable so the engine dev env
    # can resolve any connector_class the studio offers (Connection settings).
    # In production, deployers install only the integrations they need.
    "invana-neo4j",
    "invana-memgraph",
    "invana-arcadedb",
    "invana-janusgraph",
    "invana-tinkergraph",
]

[tool.uv.sources]
invana-neo4j = { path = "../integrations/invana-neo4j", editable = true }
invana-memgraph = { path = "../integrations/invana-memgraph", editable = true }
invana-arcadedb = { path = "../integrations/invana-arcadedb", editable = true }
invana-janusgraph = { path = "../integrations/invana-janusgraph", editable = true }
invana-tinkergraph = { path = "../integrations/invana-tinkergraph", editable = true }

[project.scripts]
invana = "invana.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invana"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "UP",     # pyupgrade (modern syntax)
    "B",      # flake8-bugbear (likely bugs)
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "RET",    # flake8-return
    "PIE",    # flake8-pie (misc lints)
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
    "TID",    # flake8-tidy-imports (ban relative imports, etc.)
    "PL",     # Pylint (PLC/PLE/PLR/PLW) — includes PLC0415 in-function imports
]
ignore = [
    "B008",     # FastAPI requires Depends() in function argument defaults
    "PLR2004",  # magic-value-comparison — too noisy for status strings / ints
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments (FastAPI handlers take many Depends)
    "PLR0915",  # too-many-statements
    "PLC0414",  # useless-import-alias — re-export style `import x as x` is intentional
]

[tool.ruff.lint.per-file-ignores]
# Lazy/in-function imports are intentional here:
#   telemetry/* — gated behind the optional `telemetry` extra
#   cli/*       — deferred to keep `invana` CLI startup fast
#   server/app.py — lazy router + optional-server wiring at app build time
"src/invana/telemetry/*" = ["PLC0415", "PLW0603"]  # PLW0603: idempotent one-time provider init
"src/invana/cli/*" = ["PLC0415"]
"src/invana/server/app.py" = ["PLC0415"]
# Optional/heavy SDKs imported lazily so they're only required when actually used:
#   events/services.py     — opentelemetry (telemetry extra)
#   llm_providers/services — anthropic / openai SDKs + urllib, per-provider
#   llm/providers/*        — anthropic SDK lazy-imported per provider (RFC-032)
"src/invana/events/services.py" = ["PLC0415"]
"src/invana/llm_providers/services.py" = ["PLC0415"]
"src/invana/llm/providers/*" = ["PLC0415"]
# starlette-admin ModelViews declare `fields`/`exclude_*` as plain class lists —
# the framework's documented API. RUF012 (ClassVar) doesn't apply.
"src/invana/server/admin/views.py" = ["RUF012"]
# Test idioms: in-function imports (fixtures/locality) and partially-unpacked
# tuples (`schema, _ = ...`) are fine and intentional in tests.
"tests/**" = ["PLC0415", "RUF059"]
