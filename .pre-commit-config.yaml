# Hooks with no `stages` run on commit only. The pre-push block at the end
# runs the whole-workspace checks CI runs, for the areas a push touches.
default_stages: [pre-commit]

repos:
  # ─── Commit message ───────────────────────────────────────────
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.4.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ─── Python (engine + integrations) ────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(engine|integrations)/
      - id: ruff-format
        files: ^(engine|integrations)/

  # ─── Engine band rule (docs/for-developers/building-engine/code-shape.md §4.2) ───
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter (engine bands)
        entry: bash -c 'cd engine && uv run lint-imports'
        language: system
        pass_filenames: false
        files: ^engine/src/invana/.*\.py$

      # refactor-plan.md §1: every `invana` import in integrations/ is under
      # invana.graph. A second module name means a move reached into a
      # separately-released connector package.
      - id: integrations-import-invana-graph-only
        name: integrations import only invana.graph
        entry: bash -c '[ "$(grep -rhoE "invana\.[a-z_]+" integrations/ --include="*.py" | sort -u)" = "invana.graph" ]'
        language: system
        pass_filenames: false
        files: ^(engine/src/invana|integrations)/.*\.py$

  # ─── TypeScript (studio) ──────────────────────────────────────
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.14
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.14"]
        files: ^studio/

  # ─── Before a push: whole-workspace checks, as in CI ──────────
  # Each runs only when the pushed commits touch its area.
  - repo: local
    hooks:
      - id: python-ruff-all
        name: ruff check and format (engine + integrations)
        entry: bash -c 'cd engine && uv run ruff check . ../integrations && uv run ruff format --check . ../integrations'
        language: system
        pass_filenames: false
        files: ^(engine|integrations)/
        stages: [pre-push]

      - id: studio-check-types
        name: tsc (studio, every package)
        entry: bash -c 'cd studio && pnpm check-types'
        language: system
        pass_filenames: false
        files: ^studio/
        stages: [pre-push]

      - id: studio-lint
        name: biome, boundaries, names, kit overlap (studio)
        entry: bash -c 'cd studio && pnpm lint'
        language: system
        pass_filenames: false
        files: ^studio/
        stages: [pre-push]

      - id: studio-knip
        name: knip (studio dead files and exports)
        entry: bash -c 'cd studio && pnpm knip'
        language: system
        pass_filenames: false
        files: ^studio/
        stages: [pre-push]
