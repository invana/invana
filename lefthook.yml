pre-commit:
  parallel: true
  commands:
    ruff-check:
      root: engine/
      glob: "*.py"
      run: ruff check --fix {staged_files}
    ruff-format:
      root: engine/
      glob: "*.py"
      run: ruff format {staged_files}
    biome:
      root: studio/
      glob: "*.{ts,tsx,js,json}"
      run: pnpm biome check --write {staged_files}

pre-push:
  parallel: true
  commands:
    engine-tests:
      root: engine/
      run: uv run pytest tests/unit/ -x -q
    studio-tests:
      root: studio/
      run: pnpm test run
