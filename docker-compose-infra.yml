# Infrastructure services for local development and testing.
#
# By default only the core services start: postgres, neo4j.
#   docker compose -f docker-compose-infra.yml up -d
#
# The extra graph databases (memgraph, janusgraph, arcadedb) and observability
# (hyperdx) are opt-in via profiles. Start one, or all DBs with the "extra-dbs"
# group profile:
#   docker compose -f docker-compose-infra.yml --profile memgraph up -d
#   docker compose -f docker-compose-infra.yml --profile extra-dbs up -d
#   docker compose -f docker-compose-infra.yml --profile telemetry up -d
#
# Pass the same --profile flag on down/stop to also tear those services down.

services:
  postgres:
    image: postgres:18
    container_name: invana-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: invana_user
      POSTGRES_PASSWORD: change_this_password
      POSTGRES_DB: invana_db
    volumes:
      # PG18+ stores the cluster in a version-specific subdir; mount the parent
      # (not /var/lib/postgresql/data) so pg_upgrade works across major versions.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invana_user -d invana_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j_5:
    image: neo4j:5-community
    container_name: invana-neo4j
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/testpassword
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  janusgraph:
    image: janusgraph/janusgraph:latest
    container_name: invana-janusgraph
    profiles: ["janusgraph", "extra-dbs"]
    ports:
      - "8182:8182" # Gremlin WebSocket
    environment:
      JAVA_OPTIONS: "-Xms512m -Xmx1024m"
    volumes:
      - janusgraph-data:/var/lib/janusgraph
    healthcheck:
      test: ["CMD-SHELL", "bin/gremlin.sh -e scripts/empty-sample.groovy 2>/dev/null || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  memgraph:
    image: memgraph/memgraph:latest
    container_name: invana-memgraph
    profiles: ["memgraph", "extra-dbs"]
    ports:
      - "17687:7687" # Bolt protocol (prefixed to avoid conflict with Neo4j)
    environment:
      MEMGRAPH_TELEMETRY_ENABLED: "false"
    volumes:
      - memgraph-data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  arcadedb:
    image: arcadedata/arcadedb:latest
    container_name: invana-arcadedb
    profiles: ["arcadedb", "extra-dbs"]
    ports:
      - "2480:2480" # HTTP API
      - "2424:2424" # Binary protocol
      - "18182:8182" # Gremlin WebSocket (prefixed to avoid conflict with JanusGraph)
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1024m"
      arcadedb.server.rootPassword: testpassword
      arcadedb.server.defaultDatabases: "testdb[root:testpassword]"
      arcadedb.server.plugins: "GremlinServer:com.arcadedb.server.gremlin.GremlinServerPlugin"
    volumes:
      - arcadedb-data:/home/arcadedb/databases
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Observability ─────────────────────────────────────────────────────────
  # HyperDX Local: no auth, no backend API, config stored in browser localStorage.
  # Includes: ClickHouse + OTel Collector (no MongoDB, no HyperDX API server)
  # UI:  http://localhost:8080  (no login required)
  # OTLP gRPC endpoint for Invana telemetry: http://localhost:4317
  hyperdx:
    image: docker.hyperdx.io/hyperdx/hyperdx-local:latest
    container_name: invana-hyperdx
    profiles: ["telemetry"]
    ports:
      - "8080:8080"   # HyperDX UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8123:8123"   # ClickHouse HTTP (optional, direct access)
    volumes:
      # Read-only ClickHouse user (invana_ro / invana_ro) for inspecting traces
      # & logs from the host without the image's bundled `default` password.
      # ClickHouse hot-reloads users.d, so it applies a few seconds after mount.
      - ./docker/clickhouse/users.d/invana-readonly.xml:/etc/clickhouse-server/users.d/invana-readonly.xml:ro
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
  janusgraph-data:
  memgraph-data:
  arcadedb-data:
  hyperdx-ch-data:
