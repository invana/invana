# Local development environment: engine + studio (both hot-reload from your
# working tree) plus backing infra.
#
# By default only the core services start: postgres, neo4j, engine, studio.
#   docker compose up -d
#
# Neo4j is the only graph database that starts by default. The extra graph
# databases (memgraph, janusgraph, arcadedb) and observability (hyperdx) are
# opt-in via profiles. Start one, or all DBs with the "extra-dbs" group
# profile:
#   docker compose --profile memgraph up -d
#   docker compose --profile extra-dbs up -d
#   docker compose --profile telemetry up -d
#
# Pass the same --profile flag on down/stop to also tear those services down.
#
# `engine` and `studio` build from engine/Dockerfile and studio/Dockerfile —
# dev images that bake deps in at build time, then bind-mount your source tree
# over them and run in reload mode. Rebuild after changing dependencies
# (`docker compose build engine studio`) — the image won't pick up a new
# pyproject.toml/package.json entry on its own. Not used for production builds
# (see docs/for-developers/modules/platform/features/command-line.md — that's a separate,
# not-yet-built image).

services:
  postgres:
    image: postgres:18
    container_name: invana-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: invana_user
      POSTGRES_PASSWORD: change_this_password
      POSTGRES_DB: invana_db
    volumes:
      # PG18+ stores the cluster in a version-specific subdir; mount the parent
      # (not /var/lib/postgresql/data) so pg_upgrade works across major versions.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invana_user -d invana_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j_5:
    image: neo4j:5-community
    container_name: invana-neo4j
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/testpassword
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── App ──────────────────────────────────────────────────────────────────
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: invana-engine
    ports:
      - "8200:8200"
    environment:
      INVANA_ENV: ${INVANA_ENV:-development}
      # Container-network default (Postgres by service name) — deliberately
      # NOT sourced from INVANA_DATABASE_URL in .env, whose value is for
      # running the engine on your host instead (see .env.example).
      INVANA_DATABASE_URL: postgresql+asyncpg://invana_user:change_this_password@postgres:5432/invana_db
      INVANA_STUDIO_BASE_URL: http://localhost:8300
      INVANA_LOG_LEVEL: ${INVANA_LOG_LEVEL:-DEBUG}
      # Auth — required outside development; falls back to a fixed insecure
      # dev key when unset (see engine/src/invana/settings.py).
      INVANA_SECRET_KEY: ${INVANA_SECRET_KEY:-}
      INVANA_ENCRYPTION_KEY: ${INVANA_ENCRYPTION_KEY:-}
      # Off by default — the OTLP collector only exists under --profile telemetry.
      INVANA_TELEMETRY_ENABLED: ${INVANA_TELEMETRY_ENABLED:-false}
    volumes:
      # Whole repo, not just engine/ — engine/pyproject.toml path-depends on
      # the sibling integrations/invana-* packages (editable).
      - .:/app
      - engine-venv:/app/engine/.venv
    # A Graph's connection URI is stored once and read by two callers: this
    # container, and an `invana` CLI you run on your host. A compose service
    # name (`neo4j_5`) only resolves here; `localhost` only resolves there.
    # `host.docker.internal` can resolve in both — Docker Desktop injects it
    # into containers, and this line does the same on plain Linux Docker — so
    # `bolt://host.docker.internal:7687` reaches Neo4j through its published
    # port either way. Add `127.0.0.1 host.docker.internal` to your host's
    # /etc/hosts to complete the other half (see demos/airways/README.md).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  studio:
    build:
      context: ./studio
      dockerfile: Dockerfile
    container_name: invana-studio
    ports:
      - "8300:8300"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8200}
      # Off by default — matches the engine's INVANA_TELEMETRY_ENABLED default
      # above; the proxy route it would export to doesn't exist unless that's
      # also on (and the telemetry profile is running), so flipping only this
      # one to true just spams the browser console with 404s.
      VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-false}
      # `pnpm dev` re-checks deps on start and re-installs when the mounted
      # node_modules has drifted from the bind-mounted lockfile. That install
      # sometimes needs to purge node_modules first, which pnpm asks to confirm
      # — and with no TTY here it aborts instead (ERR_PNPM_ABORTED_REMOVE_
      # MODULES_DIR_NO_TTY), crash-looping the container. CI=true is pnpm's own
      # remedy: it answers every such prompt non-interactively.
      CI: "true"
    volumes:
      - ./studio:/app
      - studio-node-modules:/app/node_modules
    depends_on:
      - engine

  # ── Extra graph databases (opt-in) ──────────────────────────────────────
  janusgraph:
    image: janusgraph/janusgraph:latest
    container_name: invana-janusgraph
    profiles: ["janusgraph", "extra-dbs"]
    ports:
      - "8182:8182" # Gremlin WebSocket
    environment:
      JAVA_OPTIONS: "-Xms512m -Xmx1024m"
    volumes:
      - janusgraph-data:/var/lib/janusgraph
    healthcheck:
      test: ["CMD-SHELL", "bin/gremlin.sh -e scripts/empty-sample.groovy 2>/dev/null || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  memgraph:
    image: memgraph/memgraph:latest
    container_name: invana-memgraph
    profiles: ["memgraph", "extra-dbs"]
    ports:
      - "17687:7687" # Bolt protocol (prefixed to avoid conflict with Neo4j)
    environment:
      MEMGRAPH_TELEMETRY_ENABLED: "false"
    volumes:
      - memgraph-data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  arcadedb:
    image: arcadedata/arcadedb:latest
    container_name: invana-arcadedb
    profiles: ["arcadedb", "extra-dbs"]
    ports:
      - "2480:2480" # HTTP API
      - "2424:2424" # Binary protocol
      - "18182:8182" # Gremlin WebSocket (prefixed to avoid conflict with JanusGraph)
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1024m"
      arcadedb.server.rootPassword: testpassword
      arcadedb.server.defaultDatabases: "testdb[root:testpassword]"
      arcadedb.server.plugins: "GremlinServer:com.arcadedb.server.gremlin.GremlinServerPlugin"
    volumes:
      - arcadedb-data:/home/arcadedb/databases
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Observability ─────────────────────────────────────────────────────────
  # HyperDX Local: no auth, no login. Bundles ClickHouse + OTel Collector + the
  # HyperDX API server and its MongoDB — so sources and dashboards are stored
  # server-side in /data/db, NOT in browser localStorage. Both stores are on
  # named volumes below; without them a recreate loses every dashboard.
  # UI:  http://localhost:8080  (no login required)
  #
  # OTLP ingest (both go to the same pipeline):
  #   gRPC : http://localhost:4317              — backend services (Python engine, …)
  #   HTTP : http://localhost:4318/v1/traces    — browser apps (Storybook/Studio); gRPC
  #                                                is Node-only, so the web must use HTTP
  # NOTE: the bundled collector returns CORS `Allow-Origin: *`. Browsers accept that only
  # for NON-credentialed requests — so a web OTLP exporter must send via XHR/fetch, not
  # the Beacon API (Beacon is always credentialed, and `*` + credentials is rejected). In
  # the canvas Studio/Storybook that's handled by passing `headers` to the OTLP exporter,
  # which forces the non-credentialed XHR transport (apps/storybook/stories/canvas-store/otel.ts).
  hyperdx:
    image: docker.hyperdx.io/hyperdx/hyperdx-local:latest
    container_name: invana-hyperdx
    profiles: ["telemetry"]
    ports:
      - "8080:8080"   # HyperDX UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8123:8123"   # ClickHouse HTTP (optional, direct access)
    volumes:
      # Read-only ClickHouse user (invana_ro / invana_ro) for inspecting traces
      # & logs from the host without the image's bundled `default` password.
      # ClickHouse hot-reloads users.d, so it applies a few seconds after mount.
      - ./docker/clickhouse/users.d/invana-readonly.xml:/etc/clickhouse-server/users.d/invana-readonly.xml:ro
      # ClickHouse storage — traces, logs and metrics.
      - hyperdx-data:/var/lib/clickhouse
      # HyperDX's own MongoDB — sources, saved searches and dashboards.
      - hyperdx-mongo-data:/data/db
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
  janusgraph-data:
  memgraph-data:
  arcadedb-data:
  hyperdx-data:
  hyperdx-mongo-data:
  engine-venv:
  studio-node-modules:
