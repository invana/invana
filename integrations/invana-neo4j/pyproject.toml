[project]
name = "invana-neo4j"
version = "0.0.0"
description = "Neo4j connector for Invana"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "invana",
    "neo4j>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invana_neo4j"]
