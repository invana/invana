[project]
name = "invana-memgraph"
version = "0.0.0"
description = "Memgraph connector for Invana"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "invana-engine",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.uv.sources]
invana-engine = { path = "../../engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invana_memgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
