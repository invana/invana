[project]
name = "invana-neptune"
version = "0.0.0"
description = "Amazon Neptune connector for Invana"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "invana",
    "gremlinpython>=3.7",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invana_neptune"]
