version: 2
updates:
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: npm
    directory: /studio
    schedule:
      interval: weekly
    groups:
      node-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci):"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker):"
