name: Docker

on:
  workflow_dispatch: # disabled: was push on v* tags

env:
  REGISTRY: docker.io
  ENGINE_IMAGE: invana/engine
  STUDIO_IMAGE: invana/studio
  INVANA_IMAGE: invana/invana

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # All-in-one image
      - name: Build & push invana/invana
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: invana
          push: true
          tags: |
            ${{ env.INVANA_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.INVANA_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Engine-only image
      - name: Build & push invana/engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: engine
          push: true
          tags: |
            ${{ env.ENGINE_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.ENGINE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Studio-only image
      - name: Build & push invana/studio
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: studio
          push: true
          tags: |
            ${{ env.STUDIO_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.STUDIO_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
